# golangci-lint configuration shared by the Veraison Go projects.
#
# The project's .golangci.yml is generated from the shared one plus
# an optional .golangci.project.yml using scripts/sync-config.py.
version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - lll
    - misspell
    - prealloc
    - unconvert
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - hugeParam
        - ifElseChain
        - octalLiteral
        - paramTypeCombine
        - whyNoLint
        - wrapperFunc
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - gosec
          - lll

formatters:
  enable:
    # also checks gofmt formatting
    - goimports

issues:
  # report all issues, not only the first ones of each kind
  max-issues-per-linter: 0
  max-same-issues: 0

