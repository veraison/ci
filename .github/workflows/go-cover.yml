name: go-cover

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Go module"
        type: string
        default: "."
      install-protoc:
        description: "Install protoc before running setup"
        type: boolean
        default: false
      setup:
        description: "Shell commands run before the coverage command (e.g. installing mockgen)"
        type: string
        default: ""
      cover-command:
        description: "Command printing `go test -cover` output"
        type: string
        default: "make test-cover"
      check-tests:
        description: "Fail if a package with test files did not run in cover-command"
        type: boolean
        default: true
      check-coverage:
        description: "Fail if a package reported by cover-command is below the minimum coverage"
        type: boolean
        default: true
      min-coverage:
        description: "Minimum coverage of every package in percent, required unless check-coverage is false"
        type: string
        default: ""
      codecov:
        description: "Upload the coverage profile(s) written by cover-command to codecov.io"
        type: boolean
        default: false
      codecov-files:
        description: "Comma separated coverage profiles to upload, relative to the repository root"
        type: string
        default: "coverage.txt"
      timeout-minutes:
        type: number
        default: 30
    secrets:
      CODECOV_TOKEN:
        description: "codecov.io upload token, only needed with codecov: true"
        required: false

permissions:
  contents: read

jobs:
  cover:
    name: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: "**/go.sum"
      - if: inputs.install-protoc
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc
      - name: Setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: eval "${SETUP}"
      - name: Coverage
        env:
          COVER_COMMAND: ${{ inputs.cover-command }}
        run: |
          go version
          eval "${COVER_COMMAND}" 2>&1 | tee "${RUNNER_TEMP}/cover.out"
      - name: Check all tests ran
        if: inputs.check-tests
        uses: $/.github/actions/check-tests-ran
        with:
          output: ${{ runner.temp }}/cover.out
          working-directory: ${{ inputs.working-directory }}
      - name: Check minimum coverage
        if: inputs.check-coverage
        env:
          MIN_COVERAGE: ${{ inputs.min-coverage }}
        shell: python3 {0}
        run: |
          import os, re, sys

          if not os.environ["MIN_COVERAGE"]:
              print("::error::min-coverage must be set (or check-coverage set to false)")
              sys.exit(2)
          min_cover = float(os.environ["MIN_COVERAGE"])

          cover_re = re.compile(r"coverage: (?P<pc>[\d.]+)% of statements")
          package_re = re.compile(r"^\s*(?:ok\s+)?(?P<package>[^\s:]+)\s")
          results = []
          with open(os.path.join(os.environ["RUNNER_TEMP"], "cover.out")) as f:
              for line in f:
                  m = cover_re.search(line)
                  if m is None:
                      continue
                  p = package_re.match(line)
                  package = p.group("package") if p else "(unknown)"
                  results.append((package, float(m.group("pc")), min_cover))

          if not results:
              print("::error::no coverage figures found in the output of the coverage command")
              sys.exit(2)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| package | coverage | minimum |\n|---|---:|---:|\n")
              failed = False
              for package, cover, threshold in results:
                  ok = cover >= threshold
                  failed |= not ok
                  summary.write(f"| {package} | {cover:.1f}% {'' if ok else '❌'} | {threshold:.1f}% |\n")
                  if not ok:
                      print(f"::error::{package}: coverage {cover:.1f}% is below the minimum of {threshold:.1f}%")

          sys.exit(1 if failed else 0)
      - name: Upload coverage to codecov.io
        # also upload when the minimum coverage check failed
        if: ${{ !cancelled() && inputs.codecov }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ inputs.codecov-files }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # an outage of codecov.io must not break CI
          fail_ci_if_error: false
