# Tests that should not run by default belong behind a build tag.
name: go-test

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Go module"
        type: string
        default: "."
      go-version:
        description: "Go version used in CI and the oldest go directive allowed in go.mod, bump it here to update all projects"
        type: string
        default: "1.26"
      os:
        description: "JSON list of runners to test on"
        type: string
        default: '["ubuntu-latest"]'
      install-protoc:
        description: "Install protoc before running setup"
        type: boolean
        default: false
      setup:
        description: "Shell commands run before the tests (e.g. installing mockgen)"
        type: string
        default: ""
      test-command:
        type: string
        default: "make test"
      check-tests:
        description: "Fail if a package with test files did not run in test-command"
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: "**/go.sum"
      - name: Check minimum Go version
        if: runner.os == 'Linux'
        env:
          MIN_GO_VERSION: ${{ inputs.go-version }}
        run: |
          failed=0
          while read -r mod; do
            version=$(go mod edit -json "${mod}" | jq -r .Go)
            if [ "$(printf '%s\n%s\n' "${MIN_GO_VERSION}" "${version}" | sort -V | head -n1)" != "${MIN_GO_VERSION}" ]; then
              echo "::error file=${mod}::go ${version} is older than the required go ${MIN_GO_VERSION}"
              failed=1
            fi
          done < <(find . -name go.mod -not -path '*/vendor/*')
          exit "${failed}"
      - if: inputs.install-protoc
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - name: Setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: eval "${SETUP}"
      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          go version
          eval "${TEST_COMMAND}" 2>&1 | tee "${RUNNER_TEMP}/test.out"
      - name: Check all tests ran
        if: inputs.check-tests
        uses: $/.github/actions/check-tests-ran
        with:
          output: ${{ runner.temp }}/test.out
          working-directory: ${{ inputs.working-directory }}
